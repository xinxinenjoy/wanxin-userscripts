name: Update Userscripts README

env:
  GITHUB_BRANCH: main
  README_FILE: README.md
  PUBLISH_DIR: publish
  SITE_ASSETS_DIR: site-assets
  DISTRIBUTION_BASE_URL: https://scripts.wanxinxin.dpdns.org

on:
  workflow_run:
    workflows:
      - "Build Userscripts"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-userscripts-readme
  cancel-in-progress: true

jobs:
  update-readme:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0

      - name: Generate README And Cloudflare Homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape
          import json
          import os
          import re
          import subprocess
          import sys

          ROOT = Path(".")
          README_PATH = ROOT / os.environ.get("README_FILE", "README.md")
          PUBLISH_DIR = os.environ.get("PUBLISH_DIR", "publish")
          PUBLISH_ROOT = ROOT / PUBLISH_DIR
          INDEX_PATH = PUBLISH_ROOT / "index.html"

          SITE_ASSETS_DIR = os.environ.get(
              "SITE_ASSETS_DIR",
              "site-assets"
          )
          SITE_ASSETS_ROOT = ROOT / SITE_ASSETS_DIR

          # 首页只读取 Build 已经生成好的网页优化图。
          SCRIPT_IMAGE_ROOT = (
              PUBLISH_ROOT
              / "assets"
              / "scripts"
          )

          BASE_URL = os.environ.get(
              "DISTRIBUTION_BASE_URL",
              "https://scripts.wanxinxin.dpdns.org"
          ).rstrip("/")

          GITHUB_REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
          GITHUB_REPO_URL = f"https://github.com/{GITHUB_REPOSITORY}"

          START_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$")
          END_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$")
          META_RE = re.compile(
              r"^[ \t]*//[ \t]*@([A-Za-z0-9:_-]+)(?:[ \t]+(.*?))?[ \t]*$"
          )

          TZ = ZoneInfo("Asia/Shanghai")


          def parse_meta(text, label):
              start = START_RE.search(text)
              end = END_RE.search(text)

              if not start or not end or end.start() <= start.end():
                  raise ValueError(f"{label}: 缺少完整 UserScript 元数据区")

              result = {}

              for line in text[start.start():end.end()].splitlines():
                  match = META_RE.match(line)
                  if not match:
                      continue

                  key = match.group(1)
                  value = (match.group(2) or "").strip()
                  result.setdefault(key, []).append(value)

              return result


          def first(meta, key, default=""):
              values = meta.get(key) or []
              return values[0] if values else default


          def md(value):
              return (
                  str(value or "")
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .strip()
              )


          def h(value):
              return escape(str(value or "").strip(), quote=True)


          def source_modified(relative):
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cI",
                          "--",
                          relative.as_posix(),
                      ],
                      cwd=ROOT,
                      text=True,
                      capture_output=True,
                      check=True,
                  )

                  raw = result.stdout.strip()

                  if not raw:
                      return "-", None

                  dt = datetime.fromisoformat(raw).astimezone(TZ)
                  return dt.strftime("%Y-%m-%d %H:%M"), dt

              except Exception as exc:
                  print(
                      "::warning::"
                      f"无法读取 {relative} 的最后修改时间：{exc}"
                  )
                  return "-", None


          # 1. 扫描源脚本，建立 publishID -> 原始分类 / 修改时间映射
          source_by_id = {}
          source_errors = []

          for path in sorted(ROOT.rglob("*.user.js")):
              relative = path.relative_to(ROOT)

              if relative.parts and relative.parts[0] == PUBLISH_DIR:
                  continue

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative),
                  )
              except Exception as exc:
                  source_errors.append(str(exc))
                  continue

              publish_id = first(meta, "publishID")

              if not publish_id:
                  continue

              key = publish_id.lower()

              if key in source_by_id:
                  source_errors.append(
                      f"源脚本 @publishID 重复：{publish_id}"
                  )
                  continue

              modified_at, modified_dt = source_modified(relative)

              source_by_id[key] = {
                  "relative": relative,
                  "group": (
                      relative.parts[0]
                      if len(relative.parts) > 1
                      else "根目录"
                  ),
                  "folder": (
                      relative.parent.as_posix()
                      if relative.parent != Path(".")
                      else "根目录"
                  ),
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
              }

          if source_errors:
              print("读取源脚本时发现问题：")
              for error in source_errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 2. 扫描 publish/ 正式发布脚本
          PUBLISH_ROOT.mkdir(parents=True, exist_ok=True)

          items = []
          errors = []

          for path in sorted(PUBLISH_ROOT.rglob("*.user.js")):
              relative_from_root = path.relative_to(ROOT)

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative_from_root),
                  )
              except Exception as exc:
                  errors.append(str(exc))
                  continue

              name = first(meta, "name", path.stem)
              version = first(meta, "version", "-")
              description = first(meta, "description", "")
              publish_group = first(meta, "publishGroup", "root")
              publish_id = first(
                  meta,
                  "publishID",
                  path.name[:-8] if path.name.endswith(".user.js") else path.stem,
              )

              source = source_by_id.get(publish_id.lower())

              if source:
                  display_group = source["group"]
                  display_folder = source["folder"]
                  modified_at = source["modified_at"]
                  modified_dt = source["modified_dt"]
                  source_relative = source["relative"]
              else:
                  display_group = publish_group
                  display_folder = publish_group
                  modified_at = "-"
                  modified_dt = None
                  source_relative = None

                  print(
                      "::warning::"
                      f"{publish_id} 未找到对应源脚本，分类回退为 {publish_group}"
                  )

              filename = f"{publish_id}.user.js"
              install_url = (
                  f"{BASE_URL}/"
                  f"{quote(publish_group, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )

              update_url = first(meta, "updateURL")
              download_url = first(meta, "downloadURL")

              if update_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @updateURL 不正确："
                      f"{update_url or '[缺失]'}"
                  )
                  continue

              if download_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @downloadURL 不正确："
                      f"{download_url or '[缺失]'}"
                  )
                  continue

              github_raw = (
                  f"https://raw.githubusercontent.com/"
                  f"{GITHUB_REPOSITORY}/{GITHUB_BRANCH}/"
                  + "/".join(
                      quote(part, safe="._-")
                      for part in relative_from_root.parts
                  )
              )

              if source_relative:
                  github_source = (
                      f"{GITHUB_REPO_URL}/blob/{GITHUB_BRANCH}/"
                      + "/".join(
                          quote(part, safe="._-")
                          for part in source_relative.parts
                      )
                  )
              else:
                  github_source = GITHUB_REPO_URL

              items.append({
                  "name": name,
                  "version": version,
                  "description": description,
                  "display_group": display_group,
                  "display_folder": display_folder,
                  "publish_group": publish_group,
                  "publish_id": publish_id,
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
                  "install_url": install_url,
                  "github_raw": github_raw,
                  "github_source": github_source,
              })

          if errors:
              print("生成 README / 首页前发现以下问题：")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 3. 分类
          groups = {}

          for item in items:
              groups.setdefault(item["display_group"], []).append(item)

          latest = max(
              (item for item in items if item["modified_dt"] is not None),
              key=lambda x: x["modified_dt"],
              default=None,
          )

          latest_text = latest["modified_at"] if latest else "-"

          # 页面右上角显示“页面改版时间”。
          # 取 update-readme.yml 本身最后一次 Git 修改时间，
          # 普通脚本更新导致的自动重新生成不会改变它。
          page_modified_text, _ = source_modified(
              Path(".github/workflows/update-readme.yml")
          )


          # 4. README
          lines = [
              '<div align="center">',
              '',
              '# 🧰 WanXin Userscripts',
              '',
              '**个人维护的 Tampermonkey 用户脚本集合**',
              '',
              f'🌐 **脚本主页：[{BASE_URL}]({BASE_URL})**',
              '',
              'GitHub 作为唯一开发源，Cloudflare Pages 提供展示、安装与自动更新。',
              '',
              f'当前正式发布 **{len(items)}** 个脚本 · 最近修改 **{latest_text}**',
              '',
              '</div>',
              '',
              '---',
              '',
              '## 🚀 快速开始',
              '',
              '### 1. 安装 Tampermonkey',
              '',
              '| 浏览器 | 安装入口 |',
              '|---|---|',
              '| Chrome | [Crx搜搜 · Chrome版](https://www.crxsoso.com/webstore/detail/dhdgffkkebhmkfjojejmpbldmpobfkfo) |',
              '| Edge | [Crx搜搜 · Edge版](https://www.crxsoso.com/addon/detail/iikmkjmpaadaobahmlepeloendndfphd) |',
              '| Firefox | [Crx搜搜 · Firefox版](https://www.crxsoso.com/firefox/detail/tampermonkey) |',
              '| 扩展聚合站 | [Crx搜搜](https://www.crxsoso.com/) |',
              '',
              '### 2. 安装脚本',
              '',
              '推荐进入上方 **脚本主页**，找到需要的脚本后点击 **立即安装**。',
              '',
              f'> 安装和自动更新统一使用 `{BASE_URL}`，GitHub Raw 仅作为备用。',
              '',
              '### 3. 检查更新',
              '',
              '打开 **Tampermonkey → 管理面板 → 检查用户脚本更新**。',
              '',
              '脚本通过元数据中的 `@version` 判断新版，并通过固定的 `@updateURL` / `@downloadURL` 自动更新。',
              '',
              '---',
              '',
              '## 📦 脚本列表',
              '',
          ]

          if not items:
              lines.extend([
                  '> 暂无正式发布脚本。',
                  '',
              ])

          else:
              for group in sorted(groups, key=str.lower):
                  group_items = sorted(
                      groups[group],
                      key=lambda x: (
                          x["name"].lower(),
                          x["publish_id"].lower(),
                      ),
                  )

                  lines.extend([
                      f'### {md(group)} · {len(group_items)} 个',
                      '',
                      '| 脚本 | 版本 | 修改时间 | 功能说明 | 安装 |',
                      '|---|---:|---|---|---|',
                  ])

                  for item in group_items:
                      lines.append(
                          '| '
                          + f"**{md(item['name'])}** | "
                          + f"`{md(item['version'])}` | "
                          + f"{md(item['modified_at'])} | "
                          + f"{md(item['description']) or '-'} | "
                          + f"[⚡ 推荐安装]({item['install_url']})"
                          + f" · [GitHub 备用]({item['github_raw']}) |"
                      )

                  lines.append('')

          lines.extend([
              '---',
              '',
              '## 🧩 Tampermonkey 使用说明',
              '',
              '<details>',
              '<summary><strong>如何安装脚本</strong></summary>',
              '',
              '1. 安装 Tampermonkey。',
              '2. 打开脚本主页。',
              '3. 点击对应脚本的 **立即安装**。',
              '4. 在 Tampermonkey 安装页面确认后点击 **安装**。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>如何手动检查更新</strong></summary>',
              '',
              '打开 Tampermonkey 管理面板，点击 **检查用户脚本更新**。',
              '',
              'Tampermonkey 会读取 `@updateURL`，比较远程与本地 `@version`；远程版本更高时，通过 `@downloadURL` 获取新版。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>新版刚发布但暂时没有检测到</strong></summary>',
              '',
              '请先等待 GitHub Actions 与 Cloudflare Pages 部署完成，再重新检查。',
              '',
              '如果需要立即更新，也可以重新点击脚本主页中的 **立即安装** 覆盖更新。',
              '',
              '</details>',
              '',
              '---',
              '',
              '## 🔄 发布架构',
              '',
              '```text',
              '本地修改',
              '   ↓',
              'GitHub main',
              '   ↓',
              'Build Userscripts',
              '   ↓',
              'publish/',
              '   ↓',
              'Update Userscripts README',
              '   ├─ README.md',
              '   └─ publish/index.html',
              '          ↓',
              'Cloudflare Pages',
              '   ├─ 展示主页',
              '   ├─ 脚本安装',
              '   └─ Tampermonkey 自动更新',
              '',
              '同时：README + publish/ → GitCode 备用镜像',
              '```',
              '',
              '---',
              '',
              '<div align="center">',
              '',
              'README 与脚本主页由 GitHub Actions 自动维护。',
              '',
              '</div>',
              '',
          ])

          README_PATH.write_text(
              "\n".join(lines),
              encoding="utf-8",
              newline="\n",
          )


          # 5. Cloudflare Pages 首页
          TAMPERMONKEY_STORE = "https://www.crxsoso.com/"
          TAMPERMONKEY_CHROME = (
              "https://www.crxsoso.com/webstore/detail/"
              "dhdgffkkebhmkfjojejmpbldmpobfkfo"
          )
          TAMPERMONKEY_EDGE = (
              "https://www.crxsoso.com/addon/detail/"
              "iikmkjmpaadaobahmlepeloendndfphd"
          )
          TAMPERMONKEY_FIREFOX = (
              "https://www.crxsoso.com/firefox/detail/tampermonkey"
          )

          SITE_ICON = (
              "https://xinxinenjoy.github.io/picx-images-hosting/"
              "红领巾头像.8z6ofxnuml.jpg"
          )

          SERIES_RE = re.compile(
              r"(?:^|[^0-9])(\d+)\.(\d+)(?=[^0-9]|$)"
          )


          def detect_series(name):
              match = SERIES_RE.search(str(name or ""))

              if not match:
                  return "其他"

              return f"{int(match.group(1))}.x"


          def series_sort_key(value):
              match = re.match(r"^(\d+)\.x$", str(value or ""))

              if match:
                  return (0, int(match.group(1)))

              return (1, str(value or "").lower())


          # 页面展示名称与仓库真实路径解耦。
          # 这里可以按需增加“源码目录 -> 页面分类名称”的映射。
          FOLDER_LABEL_OVERRIDES = {
              "2.Work/1.扁鹊SOA": "扁鹊 SOA",
          }


          def folder_display_name(folder):
              folder = str(folder or "").strip()

              if folder in FOLDER_LABEL_OVERRIDES:
                  return FOLDER_LABEL_OVERRIDES[folder]

              if not folder or folder == "根目录":
                  return "其他工具"

              # 默认只取最后一级目录，并去掉“1.”、“2-”一类仓库排序前缀。
              name = folder.replace("\\", "/").rstrip("/").split("/")[-1]
              name = re.sub(r"^\d+[._、\-\s]*", "", name).strip()

              # 中文名称与 SOA 连写时增加空格，仅影响页面展示。
              name = re.sub(r"(?<=[\u4e00-\u9fff])SOA$", " SOA", name)

              return name or folder


          SUPPORTED_SCRIPT_IMAGE_SUFFIXES = {
              ".webp",
          }


          def natural_sort_key(value):
              return [
                  int(part) if part.isdigit() else part.lower()
                  for part in re.split(r"(\d+)", str(value))
              ]


          def script_images(publish_id):
              # Build 会把原图自动压缩成：
              # publish/assets/scripts/<publishID>/<name>.webp
              # publish/assets/scripts/<publishID>/thumbs/<name>.webp
              #
              # 首页只读取实际存在的发布文件，避免原图格式与
              # 最终 WebP 文件名之间产生不一致。
              folder = SCRIPT_IMAGE_ROOT / publish_id
              thumb_folder = folder / "thumbs"

              if not folder.is_dir():
                  return []

              files = sorted(
                  (
                      path
                      for path in folder.iterdir()
                      if path.is_file()
                      and path.suffix.lower() in SUPPORTED_SCRIPT_IMAGE_SUFFIXES
                  ),
                  key=lambda path: natural_sort_key(path.name),
              )

              result = []

              for path in files:
                  encoded_id = quote(
                      publish_id,
                      safe="._-"
                  )
                  encoded_name = quote(
                      path.name,
                      safe="._-"
                  )

                  full_url = (
                      "/assets/scripts/"
                      f"{encoded_id}/"
                      f"{encoded_name}"
                  )

                  thumb_path = thumb_folder / path.name

                  if thumb_path.is_file():
                      thumb_url = (
                          "/assets/scripts/"
                          f"{encoded_id}/thumbs/"
                          f"{encoded_name}"
                      )
                  else:
                      thumb_url = full_url

                  result.append({
                      "name": path.name,
                      "url": full_url,
                      "thumb_url": thumb_url,
                  })

              return result


          # Cloudflare 页面只按业务分类展示。
          # 1.x / 2.x / 其他等编号仅用于排序，不额外显示分组标题。
          page_groups = {}

          for item in items:
              series = detect_series(item["name"])
              item["series_group"] = series
              item["folder_label"] = folder_display_name(item["display_folder"])

              page_groups.setdefault(
                  item["display_folder"], []
              ).append(item)

          buttons = [
              '<button class="filter active" data-group="all">全部脚本</button>'
          ]

          for folder in sorted(
              page_groups,
              key=lambda value: folder_display_name(value).lower(),
          ):
              folder_count = len(page_groups[folder])
              folder_label = folder_display_name(folder)

              buttons.append(
                  f'<button class="filter" data-group="{h(folder)}">'
                  f'{h(folder_label)} <span>{folder_count}</span>'
                  '</button>'
              )

          page_sections = []

          for folder in sorted(
              page_groups,
              key=lambda value: folder_display_name(value).lower(),
          ):
              folder_label = folder_display_name(folder)
              group_items = sorted(
                  page_groups[folder],
                  key=lambda x: (
                      series_sort_key(x["series_group"]),
                      x["name"].lower(),
                      x["publish_id"].lower(),
                  ),
              )

              cards = []

              for item in group_items:
                  search_text = " ".join([
                      item["name"],
                      item["description"],
                      item["folder_label"],
                  ]).lower()

                  images = script_images(item["publish_id"])
                  image_button = ""

                  if images:
                      gallery_items = [
                          {
                              "full": image["url"],
                              "thumb": image["thumb_url"],
                          }
                          for image in images
                      ]

                      image_button = (
                          '<button class="button button-secondary '
                          'script-images-button" '
                          'type="button" '
                          f'data-title="{h(item["name"])}" '
                          f'data-images="{h(json.dumps(gallery_items, ensure_ascii=False))}">'
                          '查看图片 '
                          f'<span class="image-count">{len(images)}</span>'
                          '</button>'
                      )

                  modified_date = (
                      item["modified_at"]
                      if item["modified_at"] and item["modified_at"] != "-"
                      else "-"
                  )

                  cards.append(
                      f"""
                      <article class="script-card"
                               data-folder="{h(item["display_folder"])}"
                               data-script-id="{h(item["publish_id"])}"
                               data-search="{h(search_text)}">
                        <div class="script-card-head">
                          <h3>{h(item["name"])}</h3>
                          <span class="script-version">v{h(item["version"])}</span>
                        </div>

                        <p class="script-description">
                          {h(item["description"]) or "暂无功能说明"}
                        </p>
                        <button class="description-toggle"
                                type="button"
                                hidden>
                          展开说明
                        </button>

                        <div class="script-card-foot">
                          <div class="script-meta">
                            <span>更新 {h(modified_date)}</span>
                            <span class="install-count" hidden>
                              安装 <strong>0</strong> 次
                            </span>
                          </div>

                          <div class="script-actions">
                            <a class="button button-primary script-install-link"
                               href="{h(item["install_url"])}"
                               data-script-id="{h(item["publish_id"])}">
                              立即安装
                            </a>
                            {image_button}
                            <a class="button button-secondary"
                               href="{h(item["github_source"])}"
                               target="_blank"
                               rel="noopener noreferrer">
                              查看源码
                            </a>
                          </div>
                        </div>
                      </article>
                      """
                  )

              page_sections.append(
                  f"""
                  <section class="folder-group" data-folder="{h(folder)}">
                    <div class="folder-head">
                      <div class="folder-title-line">
                        <h2>{h(folder_label)}</h2>
                        <span class="folder-count">{len(group_items)} 个脚本</span>
                      </div>
                    </div>

                    <div class="script-grid">
                      {''.join(cards)}
                    </div>
                  </section>
                  """
              )

          html = f"""<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description"
                  content="WanXin Userscripts：Tampermonkey 用户脚本安装、更新与使用主页">
            <meta name="color-scheme" content="light">
            <link rel="icon" type="image/jpeg" href="{h(SITE_ICON)}">
            <link rel="shortcut icon" href="{h(SITE_ICON)}">
            <link rel="apple-touch-icon" href="{h(SITE_ICON)}">
            <title>WanXin Userscripts</title>

            <style>
              :root {{
                --page: #f5f6f8;
                --panel: #ffffff;
                --panel-soft: #fafafa;
                --text: #20242d;
                --muted: #727986;
                --line: #e4e7ec;
                --accent: #e5484d;
                --accent-dark: #cf393f;
                --accent-soft: #fff0f0;
                --green: #37a856;
                --green-dark: #2f934b;
                --shadow: 0 14px 38px rgba(23, 28, 38, .08);
                --radius-xl: 26px;
                --radius-lg: 18px;
                --radius-md: 13px;
              }}

              * {{
                box-sizing: border-box;
              }}

              html {{
                scroll-behavior: smooth;
              }}

              body {{
                margin: 0;
                color: var(--text);
                background:
                  radial-gradient(circle at 15% -10%, #ffffff 0, transparent 34rem),
                  var(--page);
                font-family:
                  "PingFang SC",
                  "Microsoft YaHei",
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }}

              a {{
                color: inherit;
                text-decoration: none;
              }}

              button,
              input {{
                font: inherit;
              }}

              .wrap {{
                width: min(1180px, calc(100% - 32px));
                margin: 0 auto;
              }}

              .hero {{
                padding: 42px 0 20px;
              }}

              .hero-panel {{
                overflow: hidden;
                position: relative;
                padding: 42px;
                border: 1px solid rgba(229, 72, 77, .10);
                border-radius: var(--radius-xl);
                background:
                  linear-gradient(135deg, #ffffff 0%, #fff7f7 100%);
                box-shadow: var(--shadow);
              }}

              .page-updated {{
                position: absolute;
                z-index: 2;
                top: 20px;
                right: 22px;
                padding: 7px 10px;
                border: 1px solid rgba(229, 72, 77, .10);
                border-radius: 999px;
                color: #8b7379;
                background: rgba(255, 255, 255, .78);
                font-size: 11px;
                font-weight: 700;
                backdrop-filter: blur(8px);
              }}

              .hero-panel::after {{
                content: "";
                position: absolute;
                right: -80px;
                top: -120px;
                width: 310px;
                height: 310px;
                border-radius: 50%;
                background: rgba(229, 72, 77, .055);
                pointer-events: none;
              }}

              .brand-row {{
                display: flex;
                align-items: center;
                gap: 15px;
              }}

              .brand-avatar {{
                display: block;
                width: 58px;
                height: 58px;
                flex: 0 0 auto;
                object-fit: cover;
                border: 3px solid #fff;
                border-radius: 18px;
                background: #fff;
                box-shadow:
                  0 0 0 1px rgba(229, 72, 77, .12),
                  0 9px 22px rgba(23, 28, 38, .13);
              }}

              .eyebrow {{
                margin: 0 0 4px;
                color: var(--accent);
                font-size: 13px;
                font-weight: 800;
                letter-spacing: .04em;
                text-transform: uppercase;
              }}

              h1 {{
                margin: 0;
                font-size: clamp(32px, 6vw, 54px);
                line-height: 1.08;
                letter-spacing: -1.2px;
              }}

              .hero-copy {{
                position: relative;
                z-index: 1;
                max-width: 820px;
                margin: 20px 0 0;
                color: var(--muted);
                font-size: 16px;
                line-height: 1.85;
              }}

              .hero-actions {{
                position: relative;
                z-index: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 24px;
              }}

              .button {{
                display: inline-flex;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                padding: 0 16px;
                border: 1px solid transparent;
                border-radius: 12px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 750;
                transition:
                  transform .15s ease,
                  background .15s ease,
                  border-color .15s ease;
              }}

              .button:hover {{
                transform: translateY(-1px);
              }}

              .button-primary {{
                color: #fff;
                background: var(--accent);
              }}

              .button-primary:hover {{
                background: var(--accent-dark);
              }}

              .button-secondary {{
                border-color: var(--line);
                background: #fff;
              }}

              .button-secondary:hover {{
                border-color: #d4d7de;
                background: #fafafa;
              }}

              .hero-stats {{
                position: relative;
                z-index: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 25px;
              }}

              .stat-pill {{
                padding: 8px 11px;
                border: 1px solid rgba(229, 72, 77, .10);
                border-radius: 999px;
                color: #6f5960;
                background: rgba(255,255,255,.75);
                font-size: 13px;
              }}

              .stat-pill strong {{
                color: var(--text);
              }}

              .section {{
                padding: 18px 0;
              }}

              .section-head {{
                display: flex;
                gap: 18px;
                align-items: flex-end;
                justify-content: space-between;
                margin-bottom: 16px;
              }}

              .section-title {{
                margin: 0;
                font-size: 25px;
                line-height: 1.3;
              }}

              .section-desc {{
                max-width: 720px;
                margin: 6px 0 0;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.7;
              }}

              .quick-start-flow {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0;
                margin-bottom: 16px;
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: #f8f9fb;
              }}

              .quick-start-item {{
                position: relative;
                display: flex;
                min-width: 0;
                gap: 10px;
                align-items: center;
                padding: 13px 15px;
              }}

              .quick-start-item + .quick-start-item {{
                border-left: 1px solid var(--line);
              }}

              .quick-start-number {{
                display: grid;
                flex: 0 0 auto;
                width: 27px;
                height: 27px;
                place-items: center;
                border-radius: 50%;
                color: #fff;
                background: var(--accent);
                font-size: 12px;
                font-weight: 850;
              }}

              .quick-start-copy {{
                min-width: 0;
              }}

              .quick-start-copy strong {{
                display: block;
                font-size: 13px;
                line-height: 1.4;
              }}

              .quick-start-copy span {{
                display: block;
                overflow: hidden;
                margin-top: 2px;
                color: var(--muted);
                font-size: 11px;
                line-height: 1.45;
                text-overflow: ellipsis;
                white-space: nowrap;
              }}

              .tm-panel {{
                padding: 22px;
                border: 1px solid var(--line);
                border-radius: var(--radius-xl);
                background: #fff;
                box-shadow: 0 8px 24px rgba(23, 28, 38, .045);
              }}

              .tm-guide-details {{
                margin-bottom: 16px;
                border: 1px solid rgba(229, 72, 77, .18);
                border-radius: var(--radius-lg);
                background: rgba(255, 255, 255, .92);
                overflow: hidden;
              }}

              .tm-guide-toggle {{
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                padding: 15px 17px;
                color: #fff;
                background: linear-gradient(135deg, #e5484d, #ef6469);
                cursor: pointer;
                list-style: none;
                user-select: none;
              }}

              .tm-guide-toggle::-webkit-details-marker {{
                display: none;
              }}

              .tm-guide-toggle-main {{
                display: flex;
                min-width: 0;
                gap: 10px;
                align-items: center;
              }}

              .tm-guide-toggle-icon {{
                display: grid;
                flex: 0 0 auto;
                width: 30px;
                height: 30px;
                place-items: center;
                border-radius: 50%;
                color: var(--accent);
                background: #fff;
                font-size: 14px;
                font-weight: 900;
              }}

              .tm-guide-toggle-text {{
                min-width: 0;
              }}

              .tm-guide-toggle-title {{
                display: block;
                font-size: 14px;
                font-weight: 850;
                line-height: 1.35;
              }}

              .tm-guide-toggle-desc {{
                display: block;
                margin-top: 2px;
                color: rgba(255, 255, 255, .82);
                font-size: 11px;
                line-height: 1.4;
              }}

              .tm-guide-toggle-action {{
                flex: 0 0 auto;
                font-size: 11px;
                font-weight: 800;
                opacity: .92;
              }}

              .tm-guide-toggle-action::after {{
                content: "展开 ↓";
              }}

              .tm-guide-details[open] .tm-guide-toggle-action::after {{
                content: "收起 ↑";
              }}

              .tm-guide-body {{
                padding: 18px;
                background: linear-gradient(
                  135deg,
                  rgba(255, 248, 248, .96),
                  rgba(255, 255, 255, .98)
                );
              }}

              .tm-guide-section + .tm-guide-section {{
                margin-top: 17px;
                padding-top: 16px;
                border-top: 1px solid rgba(229, 72, 77, .10);
              }}

              .tm-guide-section h4 {{
                margin: 0 0 9px;
                color: var(--text);
                font-size: 13px;
                font-weight: 850;
              }}

              .tm-guide-list {{
                display: grid;
                gap: 7px;
                margin: 0;
                padding: 0;
                list-style: none;
              }}

              .tm-guide-list li {{
                position: relative;
                padding-left: 18px;
                color: #616775;
                font-size: 12px;
                line-height: 1.65;
              }}

              .tm-guide-list li::before {{
                content: "✓";
                position: absolute;
                top: 0;
                left: 0;
                color: var(--accent);
                font-weight: 900;
              }}

              .tm-guide-list strong {{
                color: var(--text);
              }}

              .tm-guide-steps {{
                margin: 0;
                padding-left: 20px;
                color: #616775;
                font-size: 12px;
                line-height: 1.8;
              }}

              .tm-guide-tip {{
                margin: 10px 0 0;
                padding: 10px 12px;
                border-radius: 10px;
                color: #7d6268;
                background: rgba(229, 72, 77, .07);
                font-size: 11px;
                line-height: 1.6;
              }}

              .tm-guide-link {{
                display: inline-flex;
                margin-top: 8px;
                color: var(--accent);
                font-size: 11px;
                font-weight: 800;
              }}

              .tm-grid {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
              }}

              .tm-card {{
                position: relative;
                display: flex;
                min-height: 178px;
                flex-direction: column;
                padding: 20px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: var(--panel-soft);
                transition:
                  transform .16s ease,
                  box-shadow .16s ease,
                  border-color .16s ease;
              }}

              .tm-card:hover {{
                transform: translateY(-2px);
                border-color: #d7dbe2;
                box-shadow: 0 12px 28px rgba(23, 28, 38, .07);
              }}

              .tm-card.recommended {{
                border-color: rgba(55, 168, 86, .55);
                box-shadow: 0 0 0 3px rgba(55, 168, 86, .07);
              }}

              .tm-card.recommended::after {{
                content: "当前浏览器推荐";
                position: absolute;
                right: 14px;
                top: 14px;
                padding: 5px 8px;
                border-radius: 999px;
                color: #267f40;
                background: #eaf8ee;
                font-size: 11px;
                font-weight: 800;
              }}

              .tm-card-top {{
                display: flex;
                gap: 12px;
                align-items: center;
                padding-right: 78px;
              }}

              .tm-logo {{
                display: grid;
                flex: 0 0 auto;
                width: 46px;
                height: 46px;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                align-items: center;
                padding: 6px;
                border-radius: 12px;
                background: #232323;
              }}

              .tm-logo span {{
                display: block;
                width: 100%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #f3f3f3;
              }}

              .tm-name {{
                margin: 0;
                font-size: 17px;
                line-height: 1.25;
              }}

              .tm-browser {{
                margin-top: 3px;
                color: var(--muted);
                font-size: 12px;
              }}

              .tm-meta {{
                margin: 14px 0 16px;
                color: var(--muted);
                font-size: 13px;
              }}

              .store-button {{
                display: inline-flex;
                width: 100%;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                margin-top: auto;
                border-radius: 11px;
                color: #fff;
                background: var(--green);
                font-size: 14px;
                font-weight: 800;
              }}

              .store-button:hover {{
                background: var(--green-dark);
              }}

              .tm-note {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 14px;
                align-items: center;
                justify-content: space-between;
                margin-top: 14px;
                padding: 13px 15px;
                border-radius: 12px;
                color: var(--muted);
                background: #f7f8fa;
                font-size: 13px;
                line-height: 1.6;
              }}

              .tm-note a {{
                color: var(--accent);
                font-weight: 700;
              }}

              .toolbar {{
                position: sticky;
                top: 0;
                z-index: 20;
                padding: 12px 0;
                background: rgba(245, 246, 248, .91);
                backdrop-filter: blur(15px);
              }}

              .toolbar-inner {{
                display: flex;
                gap: 12px;
                align-items: center;
              }}

              .search {{
                flex: 1;
                min-width: 260px;
                height: 46px;
                padding: 0 16px;
                border: 1px solid var(--line);
                border-radius: 14px;
                outline: none;
                background: #fff;
                font-size: 15px;
              }}

              .search:focus {{
                border-color: #ef9ca0;
                box-shadow: 0 0 0 4px rgba(229, 72, 77, .08);
              }}

              .filters {{
                display: flex;
                gap: 8px;
                overflow-x: auto;
                scrollbar-width: none;
              }}

              .filters::-webkit-scrollbar {{
                display: none;
              }}

              .filter {{
                padding: 10px 14px;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--muted);
                background: #fff;
                cursor: pointer;
                white-space: nowrap;
              }}

              .filter span {{
                margin-left: 4px;
                opacity: .72;
                font-size: 11px;
                font-weight: 800;
              }}

              .filter.active {{
                color: #fff;
                border-color: var(--accent);
                background: var(--accent);
              }}

              .scripts-content {{
                padding: 10px 0 42px;
              }}

              .stats-section {{
                padding: 6px 0 24px;
              }}

              .stats-section.hidden {{
                display: none;
              }}

              .stats-panel {{
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
                padding: 16px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: rgba(255, 255, 255, .84);
              }}

              .stat-item {{
                min-width: 0;
                padding: 4px 12px;
              }}

              .stat-item + .stat-item {{
                border-left: 1px solid var(--line);
              }}

              .stat-label {{
                display: block;
                margin-bottom: 5px;
                color: var(--muted);
                font-size: 12px;
              }}

              .stat-value-row {{
                display: flex;
                min-width: 0;
                flex-wrap: wrap;
                gap: 7px;
                align-items: baseline;
              }}

              .stat-value {{
                display: block;
                overflow: hidden;
                font-size: 20px;
                font-weight: 850;
                line-height: 1.35;
                text-overflow: ellipsis;
                white-space: nowrap;
              }}

              .stat-today {{
                color: var(--accent);
                font-size: 11px;
                font-weight: 800;
                line-height: 1.4;
                white-space: nowrap;
              }}

              .region-summary {{
                grid-column: 1 / -1;
                display: flex;
                gap: 14px;
                align-items: center;
                padding: 14px 12px 2px;
                border-top: 1px solid var(--line);
              }}

              .region-summary-label {{
                flex: 0 0 auto;
                color: var(--muted);
                font-size: 12px;
                font-weight: 750;
              }}

              .region-chips {{
                display: flex;
                min-width: 0;
                flex-wrap: wrap;
                gap: 7px;
              }}

              .region-chip {{
                padding: 6px 9px;
                border-radius: 999px;
                color: #6f5960;
                background: var(--accent-soft);
                font-size: 11px;
                font-weight: 750;
              }}

              .stats-detail-grid {{
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
                margin-top: 12px;
              }}

              .stats-card {{
                min-width: 0;
                padding: 18px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: rgba(255, 255, 255, .84);
              }}

              .stats-card-head {{
                display: flex;
                gap: 14px;
                align-items: flex-start;
                justify-content: space-between;
                margin-bottom: 14px;
              }}

              .stats-card-title {{
                margin: 0;
                font-size: 15px;
                font-weight: 850;
                line-height: 1.4;
              }}

              .stats-card-note {{
                margin: 4px 0 0;
                color: var(--muted);
                font-size: 11px;
                line-height: 1.45;
              }}

              .ranking-list {{
                display: grid;
                gap: 3px;
                margin: 0;
                padding: 0;
                list-style: none;
              }}

              .ranking-item {{
                display: grid;
                grid-template-columns: 24px minmax(0, 1fr) auto;
                gap: 8px;
                align-items: center;
                min-height: 36px;
                padding: 6px 0;
                border-bottom: 1px solid #f0f1f4;
              }}

              .ranking-item:last-child {{
                border-bottom: 0;
              }}

              .ranking-index {{
                display: inline-flex;
                width: 22px;
                height: 22px;
                align-items: center;
                justify-content: center;
                border-radius: 7px;
                color: var(--accent);
                background: var(--accent-soft);
                font-size: 10px;
                font-weight: 850;
              }}

              .ranking-name {{
                overflow: hidden;
                color: var(--text);
                font-size: 12px;
                font-weight: 750;
                line-height: 1.4;
                text-overflow: ellipsis;
                white-space: nowrap;
              }}

              .ranking-count {{
                color: var(--muted);
                font-size: 11px;
                font-weight: 750;
                white-space: nowrap;
              }}

              .ranking-empty {{
                padding: 28px 0;
                color: var(--muted);
                font-size: 12px;
                text-align: center;
              }}

              .folder-group {{
                margin-bottom: 28px;
              }}

              .folder-group.hidden {{
                display: none;
              }}

              .folder-head {{
                margin-bottom: 12px;
              }}

              .folder-title-line {{
                display: flex;
                flex-wrap: wrap;
                gap: 9px;
                align-items: baseline;
              }}

              .folder-title-line h2 {{
                margin: 0;
                font-size: 24px;
                line-height: 1.3;
              }}

              .folder-count {{
                color: var(--muted);
                font-size: 12px;
                font-weight: 750;
              }}

              .script-grid {{
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
              }}

              .script-card {{
                display: flex;
                min-height: 190px;
                flex-direction: column;
                padding: 18px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: var(--panel);
                box-shadow: 0 7px 20px rgba(23, 28, 38, .03);
                transition:
                  transform .16s ease,
                  box-shadow .16s ease,
                  border-color .16s ease;
              }}

              .script-card:hover {{
                transform: translateY(-2px);
                border-color: #d9dde5;
                box-shadow: var(--shadow);
              }}

              .script-card.hidden {{
                display: none;
              }}

              .script-card-head {{
                display: flex;
                gap: 14px;
                align-items: flex-start;
                justify-content: space-between;
              }}

              .script-card h3 {{
                margin: 0;
                font-size: 19px;
                line-height: 1.45;
              }}

              .script-version {{
                flex: 0 0 auto;
                padding: 6px 10px;
                border-radius: 999px;
                color: var(--accent);
                background: var(--accent-soft);
                font-size: 12px;
                font-weight: 800;
              }}

              .script-description {{
                display: -webkit-box;
                overflow: hidden;
                margin: 10px 0 0;
                color: var(--muted);
                line-height: 1.68;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
              }}

              .script-description.expanded {{
                display: block;
                overflow: visible;
                -webkit-line-clamp: unset;
              }}

              .description-toggle {{
                align-self: flex-start;
                margin: 7px 0 0;
                padding: 0;
                border: 0;
                color: var(--accent);
                background: transparent;
                cursor: pointer;
                font-size: 12px;
                font-weight: 750;
              }}

              .description-toggle:hover {{
                text-decoration: underline;
              }}

              .script-card-foot {{
                margin-top: auto;
                padding-top: 14px;
              }}

              .script-meta {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 14px;
                color: #969ca9;
                font-size: 12px;
              }}

              .install-count strong {{
                color: var(--text);
                font-weight: 800;
              }}

              .script-actions {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 12px;
              }}

              .image-count {{
                display: inline-flex;
                min-width: 18px;
                height: 18px;
                align-items: center;
                justify-content: center;
                margin-left: 5px;
                padding: 0 5px;
                border-radius: 999px;
                color: var(--muted);
                background: #f1f2f5;
                font-size: 10px;
                font-weight: 850;
              }}

              .image-modal {{
                position: fixed;
                z-index: 1000;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: rgba(20, 22, 28, .76);
                backdrop-filter: blur(8px);
              }}

              .image-modal.open {{
                display: flex;
              }}

              .image-modal-panel {{
                display: flex;
                width: min(1080px, 100%);
                max-height: min(88vh, 900px);
                flex-direction: column;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, .18);
                border-radius: 20px;
                background: #fff;
                box-shadow: 0 26px 80px rgba(0, 0, 0, .30);
              }}

              .image-modal-head {{
                display: flex;
                gap: 12px;
                align-items: center;
                justify-content: space-between;
                padding: 14px 16px;
                border-bottom: 1px solid var(--line);
              }}

              .image-modal-title {{
                overflow: hidden;
                min-width: 0;
                margin: 0;
                font-size: 15px;
                font-weight: 850;
                line-height: 1.4;
                text-overflow: ellipsis;
                white-space: nowrap;
              }}

              .image-modal-actions {{
                display: flex;
                flex: 0 0 auto;
                gap: 8px;
                align-items: center;
              }}

              .image-zoom-controls {{
                display: flex;
                gap: 4px;
                align-items: center;
                padding: 3px;
                border: 1px solid var(--line);
                border-radius: 11px;
                background: #f7f8fa;
              }}

              .image-zoom-button {{
                display: grid;
                min-width: 30px;
                height: 30px;
                place-items: center;
                padding: 0 8px;
                border: 0;
                border-radius: 8px;
                color: var(--text);
                background: transparent;
                cursor: pointer;
                font-size: 14px;
                font-weight: 800;
              }}

              .image-zoom-button:hover {{
                background: #fff;
              }}

              .image-zoom-button.reset {{
                min-width: auto;
                padding: 0 9px;
                color: var(--muted);
                font-size: 11px;
              }}

              .image-zoom-label {{
                min-width: 46px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 800;
                text-align: center;
              }}

              .image-modal-close {{
                display: grid;
                width: 34px;
                height: 34px;
                flex: 0 0 auto;
                place-items: center;
                border: 1px solid var(--line);
                border-radius: 10px;
                color: var(--muted);
                background: #fff;
                cursor: pointer;
                font-size: 20px;
                line-height: 1;
              }}

              .image-stage {{
                position: relative;
                display: grid;
                min-height: 320px;
                flex: 1;
                place-items: center;
                overflow: hidden;
                background:
                  linear-gradient(45deg, #eceef1 25%, transparent 25%),
                  linear-gradient(-45deg, #eceef1 25%, transparent 25%),
                  linear-gradient(45deg, transparent 75%, #eceef1 75%),
                  linear-gradient(-45deg, transparent 75%, #eceef1 75%),
                  #f6f7f9;
                background-position:
                  0 0,
                  0 10px,
                  10px -10px,
                  -10px 0;
                background-size: 20px 20px;
                cursor: default;
                user-select: none;
              }}

              .image-stage.zoomed {{
                cursor: grab;
              }}

              .image-stage.dragging {{
                cursor: grabbing;
              }}

              .image-stage img {{
                display: block;
                max-width: 100%;
                max-height: calc(88vh - 180px);
                object-fit: contain;
                transform-origin: center center;
                will-change: transform;
                user-select: none;
                -webkit-user-drag: none;
                touch-action: none;
              }}

              .image-stage img.zoom-animated {{
                transition: transform .13s ease;
              }}

              .image-nav {{
                position: absolute;
                top: 50%;
                display: grid;
                width: 42px;
                height: 42px;
                place-items: center;
                transform: translateY(-50%);
                border: 0;
                border-radius: 50%;
                color: #fff;
                background: rgba(20, 22, 28, .56);
                cursor: pointer;
                font-size: 24px;
                font-weight: 700;
              }}

              .image-nav:hover {{
                background: rgba(20, 22, 28, .72);
              }}

              .image-nav.prev {{
                left: 14px;
              }}

              .image-nav.next {{
                right: 14px;
              }}

              .image-nav[hidden] {{
                display: none;
              }}

              .image-modal-foot {{
                display: flex;
                gap: 14px;
                align-items: center;
                padding: 12px 16px;
                border-top: 1px solid var(--line);
                background: #fff;
              }}

              .image-counter {{
                flex: 0 0 auto;
                color: var(--muted);
                font-size: 12px;
                font-weight: 750;
              }}

              .image-thumbs {{
                display: flex;
                min-width: 0;
                gap: 7px;
                overflow-x: auto;
                scrollbar-width: thin;
              }}

              .image-thumb {{
                width: 58px;
                height: 42px;
                flex: 0 0 auto;
                overflow: hidden;
                padding: 0;
                border: 2px solid transparent;
                border-radius: 8px;
                background: #f2f3f5;
                cursor: pointer;
              }}

              .image-thumb.active {{
                border-color: var(--accent);
              }}

              .image-thumb img {{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
              }}

              body.image-modal-open {{
                overflow: hidden;
              }}

              .guide {{
                margin-bottom: 56px;
                padding: 26px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: #fff;
              }}

              .guide h2 {{
                margin: 0 0 12px;
                font-size: 23px;
              }}

              details {{
                padding: 14px 0;
                border-top: 1px solid var(--line);
              }}

              details:first-of-type {{
                border-top: 0;
              }}

              summary {{
                cursor: pointer;
                font-weight: 750;
              }}

              details p,
              details ol {{
                color: var(--muted);
                line-height: 1.8;
              }}

              .empty {{
                display: none;
                padding: 52px 0;
                text-align: center;
                color: var(--muted);
              }}

              .footer {{
                padding: 0 0 38px;
                text-align: center;
                color: #999fab;
                font-size: 13px;
              }}

              @media (max-width: 900px) {{
                .tm-guide-toggle {{
                  align-items: flex-start;
                }}

                .tm-guide-toggle-action {{
                  padding-top: 5px;
                }}

                .tm-grid {{
                  grid-template-columns: 1fr;
                }}

                .quick-start-flow {{
                  grid-template-columns: 1fr;
                }}

                .quick-start-item + .quick-start-item {{
                  border-top: 1px solid var(--line);
                  border-left: 0;
                }}

                .stats-panel,
                .stats-detail-grid {{
                  grid-template-columns: repeat(2, minmax(0, 1fr));
                }}

                .stat-item:nth-child(3) {{
                  border-left: 0;
                }}
              }}

              @media (max-width: 760px) {{
                .stats-panel {{
                  grid-template-columns: 1fr;
                }}

                .stat-item + .stat-item {{
                  border-top: 1px solid var(--line);
                  border-left: 0;
                }}

                .region-summary {{
                  align-items: flex-start;
                  flex-direction: column;
                  gap: 8px;
                }}

                .stats-detail-grid {{
                  grid-template-columns: 1fr;
                }}

                .stats-card-head {{
                  align-items: flex-start;
                  flex-direction: column;
                }}

                .trend-canvas-wrap,
                  .page-updated {{
                  position: relative;
                  top: auto;
                  right: auto;
                  display: inline-flex;
                  margin-bottom: 14px;
                }}

                .hero {{
                  padding-top: 24px;
                }}

                .hero-panel {{
                  padding: 27px 21px;
                }}

                .brand-avatar {{
                  width: 50px;
                  height: 50px;
                  border-radius: 15px;
                }}

                .folder-group {{
                  padding: 20px;
                }}

                .folder-head {{
                  align-items: flex-start;
                  flex-direction: column;
                  gap: 8px;
                }}

                .section-head {{
                  align-items: flex-start;
                  flex-direction: column;
                  gap: 5px;
                }}

                .toolbar-inner {{
                  flex-wrap: wrap;
                }}

                .search {{
                  flex-basis: 100%;
                  width: 100%;
                }}

                .filters {{
                  width: 100%;
                }}

                .script-grid {{
                  grid-template-columns: 1fr;
                }}

                .script-actions {{
                  flex-direction: column;
                }}

                .script-actions .button {{
                  width: 100%;
                }}

                .image-modal {{
                  padding: 10px;
                }}

                .image-modal-panel {{
                  max-height: 92vh;
                  border-radius: 15px;
                }}

                .image-modal-head {{
                  align-items: flex-start;
                  flex-wrap: wrap;
                }}

                .image-modal-title {{
                  width: 100%;
                }}

                .image-modal-actions {{
                  width: 100%;
                  justify-content: space-between;
                }}

                .image-zoom-controls {{
                  min-width: 0;
                }}

                .image-stage {{
                  min-height: 220px;
                }}

                .image-stage img {{
                  max-height: calc(92vh - 170px);
                }}

                .image-nav {{
                  width: 38px;
                  height: 38px;
                }}
              }}
            </style>
          </head>

          <body>
            <header class="hero">
              <div class="wrap">
                <div class="hero-panel">
                  <div class="page-updated">页面改版 {h(page_modified_text)}</div>

                  <div class="brand-row">
                    <img class="brand-avatar"
                         src="{h(SITE_ICON)}"
                         alt="WanXin Userscripts 图标">
                    <div>
                      <p class="eyebrow">Userscript Center</p>
                      <h1>WanXin Userscripts</h1>
                    </div>
                  </div>

                  <p class="hero-copy">
                    集中发布和维护 Tampermonkey 用户脚本。
                    首次使用完成一次浏览器设置后，直接选择脚本安装即可；
                    已安装脚本会自动检查后续更新。
                  </p>

                  <div class="hero-actions">
                    <a class="button button-primary" href="#scripts">
                      浏览脚本
                    </a>
                    <a class="button button-secondary" href="#tampermonkey">
                      首次使用指南
                    </a>
                    <a class="button button-secondary"
                       href="{h(GITHUB_REPO_URL)}"
                       target="_blank"
                       rel="noopener noreferrer">
                      GitHub 源码
                    </a>
                  </div>

                  <div class="hero-stats">
                    <span class="stat-pill"><strong>{len(items)}</strong> 个正式脚本</span>
                    <span class="stat-pill">最近更新 <strong>{h(latest_text)}</strong></span>
                    <span class="stat-pill">支持 Tampermonkey 自动更新</span>
                  </div>
                </div>
              </div>
            </header>

            <section class="section" id="tampermonkey">
              <div class="wrap">
                <div class="section-head">
                  <div>
                    <h2 class="section-title">首次使用</h2>
                    <p class="section-desc">
                      第一次只需完成下面三步；以后直接在脚本中心安装和使用即可。
                    </p>
                  </div>
                </div>

                <div class="tm-panel">
                  <div class="quick-start-flow" aria-label="首次使用流程">
                    <div class="quick-start-item">
                      <span class="quick-start-number">1</span>
                      <div class="quick-start-copy">
                        <strong>安装 Tampermonkey</strong>
                        <span>选择当前浏览器对应版本</span>
                      </div>
                    </div>
                    <div class="quick-start-item">
                      <span class="quick-start-number">2</span>
                      <div class="quick-start-copy">
                        <strong>开启用户脚本权限</strong>
                        <span>Chrome / Edge / 360 用户必看</span>
                      </div>
                    </div>
                    <div class="quick-start-item">
                      <span class="quick-start-number">3</span>
                      <div class="quick-start-copy">
                        <strong>安装需要的脚本</strong>
                        <span>脚本中心点击“立即安装”</span>
                      </div>
                    </div>
                  </div>

                  <details class="tm-guide-details">
                    <summary class="tm-guide-toggle">
                      <span class="tm-guide-toggle-main">
                        <span class="tm-guide-toggle-icon">?</span>
                        <span class="tm-guide-toggle-text">
                          <span class="tm-guide-toggle-title">首次使用设置与故障排查</span>
                          <span class="tm-guide-toggle-desc">
                            用户脚本权限、开发者模式、自动更新与常见问题
                          </span>
                        </span>
                      </span>
                      <span class="tm-guide-toggle-action"></span>
                    </summary>

                    <div class="tm-guide-body">
                      <div class="tm-guide-section">
                        <h4>浏览器与插件安装</h4>
                        <ul class="tm-guide-list">
                          <li>
                            <strong>请使用电脑端常规浏览器打开本页。</strong>
                            推荐 Chrome、Microsoft Edge、Firefox、360 等；
                            微信、企业微信、QQ 等应用内置浏览器无法正常安装浏览器扩展。
                          </li>
                          <li>
                            <strong>请选择与你当前浏览器对应的 Tampermonkey。</strong>
                            360 等 Chromium 内核浏览器通常可优先尝试 Chrome 版。
                          </li>
                          <li>
                            <strong>如果使用 CRX 离线安装，先开启浏览器“开发者模式”。</strong>
                            再进入扩展管理页按 Crx搜搜说明安装；在线安装正常时不需要这一步。
                          </li>
                        </ul>
                      </div>

                      <div class="tm-guide-section">
                        <h4>关键权限设置：Chrome / Edge / 360 用户必看</h4>
                        <ul class="tm-guide-list">
                          <li>
                            <strong>Tampermonkey 5.3+ 在 Chromium 浏览器中需要额外的用户脚本执行权限。</strong>
                            Chrome 138+ 可在 Tampermonkey 的“管理扩展程序”页面开启“允许用户脚本”；
                            如果没有这个开关，则开启浏览器扩展页面的“开发者模式”。
                          </li>
                          <li>
                            <strong>Edge 或其他 Chromium 内核浏览器同样需要满足上述权限条件。</strong>
                            不同浏览器的开关位置可能略有差异，设置完成后建议刷新目标网页。
                          </li>
                          <li>
                            <strong>脚本安装成功但完全不运行时，优先检查这一项。</strong>
                            这是目前 Chromium 浏览器最常见的首次使用遗漏。
                          </li>
                        </ul>
                        <a class="tm-guide-link"
                           href="https://www.tampermonkey.net/faq.php?locale=zh&amp;q=Q209"
                           target="_blank"
                           rel="noopener noreferrer">
                          Tampermonkey 官方权限说明 ↗
                        </a>
                      </div>

                      <div class="tm-guide-section">
                        <h4>Tampermonkey 内部设置</h4>
                        <ul class="tm-guide-list">
                          <li>
                            <strong>确认 Tampermonkey 总开关和目标脚本开关均处于启用状态。</strong>
                            建议把 Tampermonkey 固定到浏览器工具栏，方便随时查看当前页面是否有脚本运行。
                          </li>
                          <li>
                            <strong>建议保留用户脚本自动更新。</strong>
                            新版 Tampermonkey 将“检查更新”和“自动安装更新”逐步分开；
                            如果设置中出现“Automatic installation / 自动安装”，希望全自动更新时请保持开启。
                          </li>
                          <li>
                            <strong>一般不需要修改高级执行模式。</strong>
                            Content Script API、沙箱等高级选项保持默认即可，除非某个脚本明确要求调整。
                          </li>
                        </ul>
                      </div>

                      <div class="tm-guide-section">
                        <h4>安装脚本与常见问题</h4>
                        <ol class="tm-guide-steps">
                          <li>安装并启用 Tampermonkey，完成上面的用户脚本权限设置。</li>
                          <li>进入脚本中心，在需要的脚本卡片中点击“立即安装”。</li>
                          <li>Tampermonkey 打开确认页后，核对脚本名称并点击“安装”。</li>
                          <li>打开脚本对应的网站并刷新页面即可使用。</li>
                        </ol>
                        <ul class="tm-guide-list" style="margin-top:10px;">
                          <li>
                            <strong>点击“立即安装”后只是下载文件或显示代码：</strong>
                            先检查 Tampermonkey 是否已安装并启用，以及当前浏览器是否允许用户脚本。
                          </li>
                          <li>
                            <strong>新版暂时没有检测到：</strong>
                            等待 GitHub Actions 与 Cloudflare Pages 部署完成后再检查，
                            或重新点击“立即安装”覆盖安装最新版。
                          </li>
                        </ul>

                        <p class="tm-guide-tip">
                          公司电脑或受统一策略管理的浏览器可能禁止安装第三方扩展。
                          如果浏览器提示“由组织管理”或扩展安装被禁用，需要先确认本机策略。
                        </p>
                      </div>
                    </div>
                  </details>

                  <div class="tm-grid">
                    <article class="tm-card" data-browser="chrome">
                      <div class="tm-card-top">
                        <div class="tm-logo" aria-hidden="true">
                          <span></span><span></span>
                        </div>
                        <div>
                          <h3 class="tm-name">Tampermonkey</h3>
