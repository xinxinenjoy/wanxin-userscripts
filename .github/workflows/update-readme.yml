            <div class="toolbar">
              <div class="wrap toolbar-inner">
                <input
                  id="search"
                  class="search"
                  type="search"
                  placeholder="搜索脚本名称或功能说明..."
                  autocomplete="off"
                >
                <div class="filters">
                  {''.join(buttons)}
                </div>
              </div>
            </div>

            <main class="scripts-content">
              <div class="wrap">
                <div id="script-groups">
                  {''.join(page_sections)}
                </div>
                <div id="empty" class="empty">没有找到匹配的脚本。</div>
              </div>
            </main>

            <div class="image-modal"
                 id="image-modal"
                 aria-hidden="true"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="image-modal-title">
              <div class="image-modal-panel">
                <div class="image-modal-head">
                  <h3 class="image-modal-title" id="image-modal-title">脚本图片</h3>

                  <div class="image-modal-actions">
                    <div class="image-zoom-controls"
                         aria-label="图片缩放">
                      <button class="image-zoom-button"
                              id="image-zoom-out"
                              type="button"
                              aria-label="缩小图片">
                        −
                      </button>
                      <span class="image-zoom-label"
                            id="image-zoom-label">
                        100%
                      </span>
                      <button class="image-zoom-button"
                              id="image-zoom-in"
                              type="button"
                              aria-label="放大图片">
                        +
                      </button>
                      <button class="image-zoom-button reset"
                              id="image-zoom-reset"
                              type="button">
                        重置
                      </button>
                    </div>

                    <button class="image-modal-close"
                            id="image-modal-close"
                            type="button"
                            aria-label="关闭图片">
                      ×
                    </button>
                  </div>
                </div>

                <div class="image-stage"
                     id="image-stage"
                     title="滚轮缩放；放大后可拖动；双击快速放大/还原">
                  <button class="image-nav prev"
                          id="image-prev"
                          type="button"
                          aria-label="上一张">
                    ‹
                  </button>
                  <img id="image-current"
                       src=""
                       alt=""
                       loading="eager">
                  <button class="image-nav next"
                          id="image-next"
                          type="button"
                          aria-label="下一张">
                    ›
                  </button>
                </div>

                <div class="image-modal-foot">
                  <span class="image-counter" id="image-counter"></span>
                  <div class="image-thumbs" id="image-thumbs"></div>
                </div>
              </div>
            </div>

            <footer class="footer">
              <div class="wrap">
                WanXin Userscripts · 页面与脚本清单由 GitHub Actions 自动维护
              </div>
            </footer>

            <script>
              (() => {{
                const search = document.getElementById("search");
                const cards = [...document.querySelectorAll(".script-card")];
                const folderGroups = [...document.querySelectorAll(".folder-group")];
                const filters = [...document.querySelectorAll(".filter")];
                const empty = document.getElementById("empty");
                const ua = navigator.userAgent;
                const statsSection = document.getElementById("usage-stats");
                const statsVisits = document.getElementById("stats-visits");
                const statsVisitsToday = document.getElementById("stats-visits-today");
                const statsInstalls = document.getElementById("stats-installs");
                const statsInstallsToday = document.getElementById("stats-installs-today");
                const statsRegion = document.getElementById("stats-region");
                const statsBrowser = document.getElementById("stats-browser");
                const regionSummary = document.getElementById("region-summary");
                const regionChips = document.getElementById("region-chips");
                const statsDetails = document.getElementById("stats-details");
                const topScriptsList = document.getElementById("top-scripts");
                const topCitiesList = document.getElementById("top-cities");
                const topOperatingSystemsList = document.getElementById("top-operating-systems");
                const topDevicesList = document.getElementById("top-devices");
                const installLinks = [...document.querySelectorAll(".script-install-link")];
                const imageButtons = [...document.querySelectorAll(".script-images-button")];
                const descriptionToggles = [...document.querySelectorAll(".description-toggle")];
                const imageModal = document.getElementById("image-modal");
                const imageModalTitle = document.getElementById("image-modal-title");
                const imageModalClose = document.getElementById("image-modal-close");
                const imageStage = document.getElementById("image-stage");
                const imageCurrent = document.getElementById("image-current");
                const imagePrev = document.getElementById("image-prev");
                const imageNext = document.getElementById("image-next");
                const imageCounter = document.getElementById("image-counter");
                const imageThumbs = document.getElementById("image-thumbs");
                const imageZoomOut = document.getElementById("image-zoom-out");
                const imageZoomIn = document.getElementById("image-zoom-in");
                const imageZoomReset = document.getElementById("image-zoom-reset");
                const imageZoomLabel = document.getElementById("image-zoom-label");
                const scriptNameMap = new Map(
                  cards.map(card => [
                    card.dataset.scriptId,
                    card.querySelector("h3")?.textContent?.trim() || card.dataset.scriptId
                  ])
                );

                let activeGroup = "all";
                let browser = "";

                if (ua.includes("Edg/")) {{
                  browser = "edge";
                }} else if (ua.includes("Firefox/")) {{
                  browser = "firefox";
                }} else if (ua.includes("Chrome/") || ua.includes("Chromium/")) {{
                  browser = "chrome";
                }}

                if (browser) {{
                  const recommended = document.querySelector(
                    '.tm-card[data-browser="' + browser + '"]'
                  );

                  if (recommended) {{
                    recommended.classList.add("recommended");
                  }}
                }}

                let galleryImages = [];
                let galleryIndex = 0;

                let imageScale = 1;
                let imageOffsetX = 0;
                let imageOffsetY = 0;
                let imageDragging = false;
                let dragPointerId = null;
                let dragStartX = 0;
                let dragStartY = 0;
                let dragOriginX = 0;
                let dragOriginY = 0;

                const IMAGE_SCALE_MIN = 0.5;
                const IMAGE_SCALE_MAX = 4;
                const IMAGE_SCALE_STEP = 0.25;


                function refreshDescriptionToggles() {{
                  descriptionToggles.forEach(button => {{
                    const card = button.closest(".script-card");
                    const description = card?.querySelector(".script-description");

                    if (!description) return;

                    if (description.classList.contains("expanded")) {{
                      button.hidden = false;
                      return;
                    }}

                    // 只有真正发生两行截断时才显示“展开说明”。
                    const overflowed =
                      description.scrollHeight > description.clientHeight + 2;

                    button.hidden = !overflowed;
                  }});
                }}


                descriptionToggles.forEach(button => {{
                  button.addEventListener("click", () => {{
                    const card = button.closest(".script-card");
                    const description = card?.querySelector(".script-description");

                    if (!description) return;

                    const expanded = description.classList.toggle("expanded");
                    button.textContent = expanded ? "收起说明" : "展开说明";
                    button.hidden = false;
                  }});
                }});


                function normalizeGalleryItems(items) {{
                  if (!Array.isArray(items)) return [];

                  return items
                    .map(item => {{
                      if (typeof item === "string") {{
                        return {{
                          full: item,
                          thumb: item
                        }};
                      }}

                      if (!item || typeof item !== "object") {{
                        return null;
                      }}

                      const full = String(item.full || "");
                      const thumb = String(item.thumb || full);

                      if (!full) return null;

                      return {{
                        full,
                        thumb
                      }};
                    }})
                    .filter(Boolean);
                }}


                function applyImageTransform(animated = false) {{
                  imageCurrent.classList.toggle(
                    "zoom-animated",
                    animated
                  );

                  imageCurrent.style.transform =
                    "translate3d(" +
                    imageOffsetX +
                    "px," +
                    imageOffsetY +
                    "px,0) scale(" +
                    imageScale +
                    ")";

                  imageZoomLabel.textContent =
                    Math.round(imageScale * 100) + "%";

                  imageStage.classList.toggle(
                    "zoomed",
                    imageScale > 1.001
                  );

                  if (animated) {{
                    window.setTimeout(() => {{
                      imageCurrent.classList.remove("zoom-animated");
                    }}, 150);
                  }}
                }}


                function resetImageZoom(animated = false) {{
                  imageScale = 1;
                  imageOffsetX = 0;
                  imageOffsetY = 0;
                  imageDragging = false;
                  dragPointerId = null;

                  imageStage.classList.remove("dragging");
                  applyImageTransform(animated);
                }}


                function setImageScale(nextScale, animated = true) {{
                  const clamped = Math.max(
                    IMAGE_SCALE_MIN,
                    Math.min(IMAGE_SCALE_MAX, nextScale)
                  );

                  imageScale = Math.round(clamped * 100) / 100;

                  // 缩放回 100% 或更小时自动回到中心，
                  // 避免图片缩小后仍偏移在画布边缘。
                  if (imageScale <= 1) {{
                    imageOffsetX = 0;
                    imageOffsetY = 0;
                  }}

                  applyImageTransform(animated);
                }}


                function changeImageScale(step) {{
                  setImageScale(
                    imageScale + step,
                    true
                  );
                }}


                function renderGallery() {{
                  if (!galleryImages.length) return;

                  galleryIndex = Math.max(
                    0,
                    Math.min(galleryIndex, galleryImages.length - 1)
                  );

                  const current = galleryImages[galleryIndex];

                  imageCurrent.src = current.full;
                  imageCurrent.alt =
                    (imageModalTitle.textContent || "脚本图片") +
                    " " +
                    (galleryIndex + 1);

                  imageCounter.textContent =
                    (galleryIndex + 1) + " / " + galleryImages.length;

                  const multiple = galleryImages.length > 1;
                  imagePrev.hidden = !multiple;
                  imageNext.hidden = !multiple;
                  imageThumbs.hidden = !multiple;

                  imageThumbs.innerHTML = "";

                  if (multiple) {{
                    galleryImages.forEach((item, index) => {{
                      const button = document.createElement("button");
                      button.type = "button";
                      button.className =
                        "image-thumb" + (index === galleryIndex ? " active" : "");
                      button.setAttribute(
                        "aria-label",
                        "查看第 " + (index + 1) + " 张图片"
                      );

                      const img = document.createElement("img");
                      img.src = item.thumb || item.full;
                      img.alt = "";
                      img.loading = "lazy";

                      button.appendChild(img);
                      button.addEventListener("click", () => {{
                        galleryIndex = index;
                        resetImageZoom(false);
                        renderGallery();
                      }});

                      imageThumbs.appendChild(button);
                    }});
                  }}
                }}


                function openGallery(title, images) {{
                  galleryImages = normalizeGalleryItems(images);

                  if (!galleryImages.length) return;

                  galleryIndex = 0;
                  imageModalTitle.textContent = title || "脚本图片";
                  resetImageZoom(false);
                  renderGallery();

                  imageModal.classList.add("open");
                  imageModal.setAttribute("aria-hidden", "false");
                  document.body.classList.add("image-modal-open");
                }}


                function closeGallery() {{
                  imageModal.classList.remove("open");
                  imageModal.setAttribute("aria-hidden", "true");
                  document.body.classList.remove("image-modal-open");

                  resetImageZoom(false);
                  imageCurrent.removeAttribute("src");
                  imageThumbs.innerHTML = "";
                  galleryImages = [];
                  galleryIndex = 0;
                }}


                function moveGallery(step) {{
                  if (galleryImages.length <= 1) return;

                  galleryIndex =
                    (galleryIndex + step + galleryImages.length) %
                    galleryImages.length;

                  resetImageZoom(false);
                  renderGallery();
                }}


                imageButtons.forEach(button => {{
                  button.addEventListener("click", () => {{
                    let images = [];

                    try {{
                      images = JSON.parse(button.dataset.images || "[]");
                    }} catch (_) {{
                    }}

                    openGallery(
                      button.dataset.title || "脚本图片",
                      images
                    );
                  }});
                }});


                imageZoomOut.addEventListener(
                  "click",
                  () => changeImageScale(-IMAGE_SCALE_STEP)
                );

                imageZoomIn.addEventListener(
                  "click",
                  () => changeImageScale(IMAGE_SCALE_STEP)
                );

                imageZoomReset.addEventListener(
                  "click",
                  () => resetImageZoom(true)
                );


                imageStage.addEventListener(
                  "wheel",
                  event => {{
                    event.preventDefault();

                    changeImageScale(
                      event.deltaY < 0
                        ? IMAGE_SCALE_STEP
                        : -IMAGE_SCALE_STEP
                    );
                  }},
                  {{
                    passive: false
                  }}
                );


                imageCurrent.addEventListener("dblclick", event => {{
                  event.preventDefault();

                  if (imageScale > 1.05) {{
                    resetImageZoom(true);
                  }} else {{
                    setImageScale(2, true);
                  }}
                }});


                imageCurrent.addEventListener("pointerdown", event => {{
                  if (imageScale <= 1) return;

                  imageDragging = true;
                  dragPointerId = event.pointerId;
                  dragStartX = event.clientX;
                  dragStartY = event.clientY;
                  dragOriginX = imageOffsetX;
                  dragOriginY = imageOffsetY;

                  imageStage.classList.add("dragging");
                  imageCurrent.setPointerCapture(event.pointerId);
                  event.preventDefault();
                }});


                imageCurrent.addEventListener("pointermove", event => {{
                  if (
                    !imageDragging ||
                    event.pointerId !== dragPointerId
                  ) {{
                    return;
                  }}

                  imageOffsetX =
                    dragOriginX +
                    event.clientX -
                    dragStartX;

                  imageOffsetY =
                    dragOriginY +
                    event.clientY -
                    dragStartY;

                  applyImageTransform(false);
                }});


                function finishImageDrag(event) {{
                  if (
                    !imageDragging ||
                    (
                      event &&
                      dragPointerId !== null &&
                      event.pointerId !== dragPointerId
                    )
                  ) {{
                    return;
                  }}

                  imageDragging = false;
                  imageStage.classList.remove("dragging");

                  if (
                    event &&
                    imageCurrent.hasPointerCapture(event.pointerId)
                  ) {{
                    imageCurrent.releasePointerCapture(event.pointerId);
                  }}

                  dragPointerId = null;
                }}


                imageCurrent.addEventListener(
                  "pointerup",
                  finishImageDrag
                );

                imageCurrent.addEventListener(
                  "pointercancel",
                  finishImageDrag
                );


                imageModalClose.addEventListener(
                  "click",
                  closeGallery
                );

                imagePrev.addEventListener(
                  "click",
                  () => moveGallery(-1)
                );

                imageNext.addEventListener(
                  "click",
                  () => moveGallery(1)
                );


                imageModal.addEventListener("click", event => {{
                  if (event.target === imageModal) {{
                    closeGallery();
                  }}
                }});


                document.addEventListener("keydown", event => {{
                  if (!imageModal.classList.contains("open")) return;

                  if (event.key === "Escape") {{
                    closeGallery();
                  }} else if (event.key === "ArrowLeft") {{
                    moveGallery(-1);
                  }} else if (event.key === "ArrowRight") {{
                    moveGallery(1);
                  }} else if (event.key === "+" || event.key === "=") {{
                    changeImageScale(IMAGE_SCALE_STEP);
                  }} else if (event.key === "-") {{
                    changeImageScale(-IMAGE_SCALE_STEP);
                  }} else if (event.key === "0") {{
                    resetImageZoom(true);
                  }}
                }});


                function formatNumber(value) {{
                  const number = Number(value);

                  if (!Number.isFinite(number)) {{
                    return "-";
                  }}

                  return new Intl.NumberFormat("zh-CN").format(number);
                }}

                const DEVICE_ID_STORAGE_KEY = "wanxin_userscripts_device_id_v1";
                let anonymousDeviceId = "";

                function getAnonymousDeviceId() {{
                  if (anonymousDeviceId) return anonymousDeviceId;

                  const isValid = value =>
                    /^[A-Za-z0-9._:-]{{8,120}}$/.test(String(value || ""));

                  try {{
                    const saved = localStorage.getItem(DEVICE_ID_STORAGE_KEY);
                    if (isValid(saved)) {{
                      anonymousDeviceId = saved;
                      return anonymousDeviceId;
                    }}
                  }} catch (_) {{
                  }}

                  if (globalThis.crypto?.randomUUID) {{
                    anonymousDeviceId = globalThis.crypto.randomUUID();
                  }} else {{
                    anonymousDeviceId =
                      "d-" + Date.now().toString(36) + "-" +
                      Math.random().toString(36).slice(2) + "-" +
                      Math.random().toString(36).slice(2);
                  }}

                  try {{
                    localStorage.setItem(
                      DEVICE_ID_STORAGE_KEY,
                      anonymousDeviceId
                    );
                  }} catch (_) {{
                  }}

                  return anonymousDeviceId;
                }}

                function trackEvent(eventType, scriptId = "") {{
                  const payload = JSON.stringify({{
                    eventType,
                    scriptId,
                    deviceId: getAnonymousDeviceId()
                  }});

                  if (navigator.sendBeacon) {{
                    try {{
                      navigator.sendBeacon("/api/track", payload);
                      return;
                    }} catch (_) {{
                    }}
                  }}

                  fetch("/api/track", {{
                    method: "POST",
                    headers: {{
                      "Content-Type": "application/json"
                    }},
                    body: payload,
                    keepalive: true
                  }}).catch(() => {{}});
                }}

                function renderRanking(container, items, nameResolver) {{
                  if (!container) return;

                  container.innerHTML = "";

                  const source = Array.isArray(items) ? items.slice(0, 5) : [];

                  if (!source.length) {{
                    const emptyItem = document.createElement("li");
                    emptyItem.className = "ranking-empty";
                    emptyItem.textContent = "暂无数据";
                    container.appendChild(emptyItem);
                    return;
                  }}

                  source.forEach((item, index) => {{
                    const li = document.createElement("li");
                    li.className = "ranking-item";

                    const rank = document.createElement("span");
                    rank.className = "ranking-index";
                    rank.textContent = String(index + 1);

                    const name = document.createElement("span");
                    name.className = "ranking-name";
                    name.textContent = nameResolver(item);

                    const count = document.createElement("span");
                    count.className = "ranking-count";
                    count.textContent = formatNumber(item.count) + " 次";

                    li.append(rank, name, count);
                    container.appendChild(li);
                  }});
                }}

                function deviceDisplayName(value) {{
                  const raw = String(value || "Other");
                  const key = raw.toLowerCase();

                  const names = {{
                    desktop: "桌面端",
                    mobile: "手机",
                    tablet: "平板",
                    other: "其他"
                  }};

                  return names[key] || raw;
                }}


                function operatingSystemDisplayName(value) {{
                  const raw = String(value || "Other");

                  const names = {{
                    "Mac OS": "macOS",
                    "MacOS": "macOS",
                    "Other": "其他"
                  }};

                  return names[raw] || raw;
                }}


                async function loadStats() {{
                  try {{
                    const response = await fetch("/api/stats", {{
                      cache: "no-store"
                    }});

                    if (!response.ok) {{
                      return;
                    }}

                    const data = await response.json();
                    const hasVisits = Number.isFinite(Number(data.totalVisits));
                    const hasInstalls = Number.isFinite(Number(data.totalInstalls));

                    let regionText = "";

                    if (data.topRegion && typeof data.topRegion === "object") {{
                      const regionName = data.topRegion.name || "";
                      const regionCount = Number(data.topRegion.count);

                      if (regionName) {{
                        regionText = Number.isFinite(regionCount)
                          ? regionName + " · " + formatNumber(regionCount) + " 次"
                          : regionName;
                      }}
                    }} else if (typeof data.topRegion === "string") {{
                      regionText = data.topRegion;
                    }}

                    if (hasVisits) {{
                      statsVisits.textContent = formatNumber(data.totalVisits);
                    }}

                    if (hasInstalls) {{
                      statsInstalls.textContent = formatNumber(data.totalInstalls);
                    }}

                    // /api/stats 已经返回按北京时间生成的 recent14Days。
                    // 最后一项就是今日汇总，无需增加 D1 查询或 Cloudflare 参数。
                    const recentDays = Array.isArray(data.recent14Days)
                      ? data.recent14Days
                      : [];

                    const todayStats = recentDays.length
                      ? recentDays[recentDays.length - 1]
                      : null;

                    if (todayStats) {{
                      const todayVisits = Number(todayStats.visits);
                      const todayInstalls = Number(todayStats.installs);

                      if (Number.isFinite(todayVisits)) {{
                        statsVisitsToday.textContent =
                          "今日 +" + formatNumber(todayVisits);
                        statsVisitsToday.hidden = false;
                      }}

                      if (Number.isFinite(todayInstalls)) {{
                        statsInstallsToday.textContent =
                          "今日 +" + formatNumber(todayInstalls);
                        statsInstallsToday.hidden = false;
                      }}
                    }}

                    if (regionText) {{
                      statsRegion.textContent = regionText;
                    }}

                    const browsers = Array.isArray(data.browsers)
                      ? data.browsers.slice(0, 5)
                      : [];

                    if (browsers.length) {{
                      const topBrowser = browsers[0];
                      statsBrowser.textContent =
                        String(topBrowser.name || "其他") +
                        " · " +
                        formatNumber(topBrowser.count) +
                        " 次";
                    }}

                    const domesticRegions = Array.isArray(data.domesticRegions)
                      ? data.domesticRegions.slice(0, 5)
                      : [];

                    if (domesticRegions.length) {{
                      regionChips.innerHTML = domesticRegions
                        .map(item => {{
                          const name = String(item.name || "");
                          const count = formatNumber(item.count);
                          return '<span class="region-chip">' +
                            name + " " + count +
                            "</span>";
                        }})
                        .join("");

                      regionSummary.hidden = false;
                    }}

                    const scriptInstalls =
                      data.scriptInstalls && typeof data.scriptInstalls === "object"
                        ? data.scriptInstalls
                        : {{}};

                    cards.forEach(card => {{
                      const scriptId = card.dataset.scriptId;
                      const count = Number(scriptInstalls[scriptId]);

                      if (!Number.isFinite(count)) {{
                        return;
                      }}

                      const target = card.querySelector(".install-count");
                      const strong = target?.querySelector("strong");

                      if (target && strong) {{
                        strong.textContent = formatNumber(count);
                        target.hidden = false;
                      }}
                    }});

                    const topScripts = Array.isArray(data.topScripts)
                      ? data.topScripts.slice(0, 5)
                      : [];

                    const domesticCities = Array.isArray(data.domesticCities)
                      ? data.domesticCities.slice(0, 5)
                      : [];

                    const operatingSystems = Array.isArray(data.operatingSystems)
                      ? data.operatingSystems.slice(0, 5)
                      : [];

                    const devices = Array.isArray(data.devices)
                      ? data.devices.slice(0, 5)
                      : [];

                    renderRanking(
                      topScriptsList,
                      topScripts,
                      item => scriptNameMap.get(item.scriptId) || item.scriptId || "未知脚本"
                    );

                    renderRanking(
                      topCitiesList,
                      domesticCities,
                      item => String(item.name || "未知城市")
                    );

                    renderRanking(
                      topOperatingSystemsList,
                      operatingSystems,
                      item => operatingSystemDisplayName(item.name)
                    );

                    renderRanking(
                      topDevicesList,
                      devices,
                      item => deviceDisplayName(item.name)
                    );

                    const hasDetailData =
                      topScripts.length ||
                      domesticCities.length ||
                      operatingSystems.length ||
                      devices.length;

                    if (hasDetailData) {{
                      statsDetails.hidden = false;
                    }}

                    if (
                      hasVisits ||
                      hasInstalls ||
                      regionText ||
                      browsers.length ||
                      domesticRegions.length ||
                      hasDetailData
                    ) {{
                      statsSection.classList.remove("hidden");
                    }}
                  }} catch (_) {{
                    // 统计后端尚未启用时保持页面正常，不显示空统计区。
                  }}
                }}

                function refresh() {{
                  const query = search.value.trim().toLowerCase();
                  let visible = 0;

                  cards.forEach(card => {{
                    const groupMatch =
                      activeGroup === "all" ||
                      card.dataset.folder === activeGroup;

                    const textMatch =
                      !query ||
                      card.dataset.search.includes(query);

                    const show = groupMatch && textMatch;

                    card.classList.toggle("hidden", !show);

                    if (show) {{
                      visible += 1;
                    }}
                  }});

                  folderGroups.forEach(group => {{
                    const hasVisibleCard = [...group.querySelectorAll(".script-card")]
                      .some(card => !card.classList.contains("hidden"));

                    group.classList.toggle("hidden", !hasVisibleCard);
                  }});

                  empty.style.display = visible ? "none" : "block";
                }}

                filters.forEach(button => {{
                  button.addEventListener("click", () => {{
                    filters.forEach(item => item.classList.remove("active"));
                    button.classList.add("active");
                    activeGroup = button.dataset.group;
                    refresh();
                  }});
                }});

                search.addEventListener("input", refresh);

                installLinks.forEach(link => {{
                  link.addEventListener("click", () => {{
                    trackEvent(
                      "install_click",
                      link.dataset.scriptId || ""
                    );
                  }});
                }});

                let chartResizeTimer = null;

                window.addEventListener("resize", () => {{
                  clearTimeout(chartResizeTimer);
                  chartResizeTimer = setTimeout(() => {{
                    refreshDescriptionToggles();
                  }}, 120);
                }});

                requestAnimationFrame(refreshDescriptionToggles);
                trackEvent("page_view");
                loadStats();
              }})();
            </script>
          </body>
          </html>
          """
          INDEX_PATH.write_text(
              html,
              encoding="utf-8",
              newline="\n",
          )

          print(f"README 已生成，共 {len(items)} 个脚本。")
          print(f"Cloudflare 首页已生成：{INDEX_PATH}")
          print(f"首页地址：{BASE_URL}")
          PY

      - name: Commit README And Homepage
        shell: bash
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${README_FILE}" "${PUBLISH_DIR}/index.html"

          if git diff --cached --quiet; then
            echo "README 与首页无变化，无需提交。"
            exit 0
          fi

          SOURCE_SHA="${WORKFLOW_SOURCE_SHA}"

          if [[ -z "${SOURCE_SHA}" ]] ||
             ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            SOURCE_SHA="$(
              git log \
                --format='%H' \
                --extended-regexp \
                --invert-grep \
                --grep='^(\[AUTO·|\[auto-userscript-maintenance\]|\[auto-readme\])' \
                -n 1
            )"
          fi

          SOURCE_SUBJECT="$(
            git show \
              -s \
              --format='%s' \
              "${SOURCE_SHA}" \
              2>/dev/null ||
            true
          )"

          if [[ -z "${SOURCE_SUBJECT}" ]]; then
            SOURCE_SUBJECT="更新脚本主页"
          fi

          SOURCE_SUBJECT="${SOURCE_SUBJECT:0:120}"

          git commit \
            -m "[AUTO·主页] ${SOURCE_SUBJECT}" \
            -m "来源提交：${SOURCE_SHA}" \
            -m "自动处理：更新 README 与 Cloudflare 脚本主页。"

          git push origin "HEAD:${GITHUB_BRANCH}"

          echo "README 与 Cloudflare 脚本主页更新完成："
          echo "[AUTO·主页] ${SOURCE_SUBJECT}"
